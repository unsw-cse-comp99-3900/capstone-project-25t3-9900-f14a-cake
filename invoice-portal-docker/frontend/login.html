<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Sign in • Invoice Portal</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;max-width:420px;margin:10vh auto;padding:24px}
    h1{margin-bottom:16px}
    .card{border:1px solid #e5e5e5;border-radius:12px;padding:18px}
    .row{display:flex;flex-direction:column;gap:8px;margin:10px 0}
    input{padding:10px;border:1px solid #ccc;border-radius:10px;width:100%}
    button{padding:10px 14px;border:1px solid #ccc;border-radius:10px;background:#fff;cursor:pointer;width:100%}
    .hint{color:#666;font-size:12px}
    .status{margin-top:8px}
    .ok{color:#0a7}.err{color:#c33}
  </style>
</head>
<body>
  <h1>Sign in</h1>
  <div class="card">
    <div class="row">
      <label>Email</label>
      <input id="email" type="email" placeholder="you@example.com" value="demo@example.com"/>
    </div>
    <div class="row">
      <label>Password</label>
      <input id="password" type="password" placeholder="••••••••" value="demo1234"/>
    </div>
    <button id="btn-login">Sign in</button>
    <div class="status" id="msg"></div>
    <p class="hint">First time here? Click “Register (dev only)” to create a local account.</p>
    <button id="btn-register" style="margin-top:8px">Register (dev only)</button>
  </div>

  <script src="/common.js"></script>
  <script>
    const $ = (id)=>document.getElementById(id);
    $('btn-register').onclick = async ()=>{
      const email = $('email').value.trim();
      const password = $('password').value;
      try{
        await apiFetch('/api/auth/register', {method:'POST', body:{email, password}});
        $('msg').textContent = 'Registration successful. Please sign in.';
        $('msg').className = 'status ok';
      }catch(e){
        $('msg').textContent = 'Registration failed: ' + e.message;
        $('msg').className = 'status err';
      }
    };
    $('btn-login').onclick = async ()=>{
      const email = $('email').value.trim();
      const password = $('password').value;
      try{
        const res = await apiFetch('/api/auth/login', {method:'POST', body:{email, password}});
        saveToken(res.token);
        window.location.href = '/upload.html';
      }catch(e){
        $('msg').textContent = 'Sign-in failed: ' + e.message;
        $('msg').className = 'status err';
      }
    };
  </script>
</body>
</html>
