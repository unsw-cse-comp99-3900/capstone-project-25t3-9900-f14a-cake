version: "3.9"

services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"             # 本机 8080 -> Nginx 80
    depends_on:
      - backend               # 先起后端再起前端（仅顺序，不等健康）
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      - MAX_UPLOAD_MB=50          # 后端最大上传（MB），要与 Nginx client_max_body_size 协调
      - JWT_SECRET=change_me_now  # 生产请改成随机安全值
      - ACCESS_TOKEN_TTL_MIN=120  # Token 有效分钟数
    volumes:
      - ./data:/app/uploads       # 上传/产物(out/sent/reports)持久化
      - ./data/auth:/app/auth     # 用户数据库 users.db 持久化（注意是 auth，不是 au）
    restart: unless-stopped