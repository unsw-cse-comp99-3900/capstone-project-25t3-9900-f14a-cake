version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: einvoice-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/.env:/app/.env
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - einvoice-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: einvoice-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - einvoice-network

networks:
  einvoice-network:
    driver: bridge

volumes:
  uploads:

