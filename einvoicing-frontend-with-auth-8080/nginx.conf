server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # SPA routes
  location / { try_files $uri /index.html; }

  # Static assets caching
  location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif)$ { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }

  # ---- MOCK API ENDPOINTS (no backend needed) ----
  default_type application/json;

  # Auth
  location = /api/auth/login { return 200 '{"accessToken":"mock-jwt-token","user":{"id":"u1","name":"Alice","role":"user"}}'; }
  location = /api/auth/me    { return 200 '{"user":{"id":"u1","name":"Alice","role":"user"}}'; }
  location = /api/auth/logout{ return 200 '{"ok":true}'; }

  # ESS validate (minimal happy-path response)
  location = /api/ess/validate    { return 200 '{"report":{"reports":{"AUNZ_PEPPOL_SB_1_0_10":{"successful":true,"firedAssertionErrors":[]}}}}'; }

  # Schema validate
  location = /api/schema/validate { return 200 '{"ok":true,"messages":[]}'; }

  # Send
  location = /api/send {
    return 200 '{"ok":true,"channel":"email","deliveryId":"DLV-123456","status":"queued","time":"2025-10-15T10:44:36.064454Z"}';
  }
}
