version: '3.8'

services:
  # 后端服务 (Python/Flask)
  backend:
    build: ./backend          # 指向 backend 文件夹中的 Dockerfile
    ports:
      - "5001:5001"           # 将主机的 5001 端口映射到容器的 5001 端口
    volumes:
      - ./backend:/app        # 将本地代码挂载到容器中，**实现代码热重载**
    environment:
      - FLASK_DEBUG=1         # <--- 关键：开启 Flask 调试模式，**自动重载**
      - FLASK_APP=app.py      # <--- 告诉 Flask 你的应用主文件是 app.py
    
  # 前端服务 (React/Nginx)
  frontend:
    build: ./frontend         # 指向 frontend 文件夹中的 Dockerfile
    ports:
      - "80:80"               # 将主机的 80 端口映射到容器的 80 端口 (Nginx)
    depends_on:
      - backend               # 确保前端在后端之后启动
