services:
  db:
    image: postgres:15
    container_name: einvoice-db
    environment:
      POSTGRES_DB: invoice_db
      POSTGRES_USER: invoice_user
      POSTGRES_PASSWORD: invoice_db_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - einvoice-network
    restart: unless-stopped

  # pgadmin:
  #   image: dpage/pgadmin4
  #   container_name: einvoice-pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@admin.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "8080:80"
  #   depends_on:
  #     - db
  #   networks:
  #     - einvoice-network
  #   restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: einvoice-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/.env:/app/.env
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      # Use container name 'db' as database host
      - DATABASE_URL=postgresql://invoice_user:invoice_db_password@db:5432/invoice_db
    depends_on:
      - db
    command: >
      bash -c "
        flask db upgrade &&
        python app.py
      "
    restart: unless-stopped
    networks:
      - einvoice-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: einvoice-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - einvoice-network

  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    container_name: einvoice-frontend-test
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Anonymous volume to avoid permission issues
    command: pnpm test
    profiles:
      - test
    networks:
      - einvoice-network

networks:
  einvoice-network:
    driver: bridge

volumes:
  postgres_data:
  uploads:
